[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalz-omnisiute"
version = "0.1.0"
description = "Native Linux desktop automation suite with safe, auditable operations"
requires-python = ">=3.11"

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
