<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">Kalz deployment run</title><desc id="desc">A 3D-style deployment flow from plan through verify and rollback.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#312e81"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity=".35"/></filter></defs><rect width="1400" height="620" fill="url(#b)"/><text x="70" y="72" fill="#e6fffb" font-family="Inter,sans-serif" font-size="32" font-weight="700">DEPLOYMENT CONTROL LOOP</text><text x="72" y="104" fill="#94a3b8" font-family="Inter,sans-serif" font-size="16">preview-first · test-gated · checksum-backed · rollback-ready</text><g transform="translate(90,210)" filter="url(#s)" font-family="Inter,sans-serif"><g><polygon points="0,45 120,0 240,45 120,90" fill="#263b62" stroke="#5eead4" stroke-width="3"/><polygon points="0,45 120,90 120,160 0,115" fill="#102d46" stroke="#5eead4" stroke-width="3"/><polygon points="120,90 240,45 240,115 120,160" fill="#0d2238" stroke="#5eead4" stroke-width="3"/><text x="120" y="43" text-anchor="middle" fill="white" font-size="18" font-weight="700">PLAN</text><text x="120" y="124" text-anchor="middle" fill="#bae6fd" font-size="13">no mutation</text></g><g transform="translate(270)"><polygon points="0,45 120,0 240,45 120,90" fill="#263b62" stroke="#60a5fa" stroke-width="3"/><polygon points="0,45 120,90 120,160 0,115" fill="#102b5c" stroke="#60a5fa" stroke-width="3"/><polygon points="120,90 240,45 240,115 120,160" fill="#0c2148" stroke="#60a5fa" stroke-width="3"/><text x="120" y="43" text-anchor="middle" fill="white" font-size="18" font-weight="700">TEST</text><text x="120" y="124" text-anchor="middle" fill="#bfdbfe" font-size="13">compile + pytest</text></g><g transform="translate(540)"><polygon points="0,45 120,0 240,45 120,90" fill="#263b62" stroke="#a78bfa" stroke-width="3"/><polygon points="0,45 120,90 120,160 0,115" fill="#211d52" stroke="#a78bfa" stroke-width="3"/><polygon points="120,90 240,45 240,115 120,160" fill="#1a1744" stroke="#a78bfa" stroke-width="3"/><text x="120" y="43" text-anchor="middle" fill="white" font-size="18" font-weight="700">APPLY</text><text x="120" y="124" text-anchor="middle" fill="#ddd6fe" font-size="13">approved only</text></g><g transform="translate(810)"><polygon points="0,45 120,0 240,45 120,90" fill="#263b62" stroke="#34d399" stroke-width="3"/><polygon points="0,45 120,90 120,160 0,115" fill="#073f3a" stroke="#34d399" stroke-width="3"/><polygon points="120,90 240,45 240,115 120,160" fill="#052e2b" stroke="#34d399" stroke-width="3"/><text x="120" y="43" text-anchor="middle" fill="white" font-size="18" font-weight="700">VERIFY</text><text x="120" y="124" text-anchor="middle" fill="#a7f3d0" font-size="13">health + audit</text></g><g transform="translate(1080)"><polygon points="0,45 120,0 240,45 120,90" fill="#263b62" stroke="#fbbf24" stroke-width="3"/><polygon points="0,45 120,90 120,160 0,115" fill="#542b13" stroke="#fbbf24" stroke-width="3"/><polygon points="120,90 240,45 240,115 120,160" fill="#3b1d12" stroke="#fbbf24" stroke-width="3"/><text x="120" y="43" text-anchor="middle" fill="white" font-size="18" font-weight="700">ROLLBACK</text><text x="120" y="124" text-anchor="middle" fill="#fde68a" font-size="13">restore pointer</text></g></g><g stroke="#5eead4" stroke-width="4" fill="none"><path d="M335 285h25"/><path d="M605 285h25"/><path d="M875 285h25"/><path d="M1145 285h25"/></g><rect x="200" y="470" width="1000" height="62" rx="20" fill="#071827" stroke="#334155"/><text x="700" y="510" text-anchor="middle" fill="#cbd5e1" font-family="Inter,sans-serif" font-size="17">Every stage emits request IDs, metrics, traces, structured logs and hash-chain audit evidence.</text></svg>
