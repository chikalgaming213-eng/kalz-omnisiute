<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Kalz OmniSuite isometric architecture</title>
<desc id="desc">Layered 3D-style architecture showing user surfaces, control, intelligence, observability, security, and platform foundation.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172554"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263b62"/><stop offset="1" stop-color="#13233e"/></linearGradient>
</defs>
<rect width="1400" height="1000" fill="url(#bg)"/>
<text x="80" y="75" fill="#e6fffb" font-family="Inter, sans-serif" font-size="34" font-weight="700">KALZ OMNISUITE</text>
<text x="82" y="110" fill="#94a3b8" font-family="Inter, sans-serif" font-size="16">Native Linux operations platform · layered control, intelligence, security and observability</text>
<g filter="url(#shadow)" font-family="Inter, sans-serif">
 <g transform="translate(160,160)"><polygon points="0,50 170,0 340,50 170,100" fill="url(#top)" stroke="#5eead4" stroke-width="3"/><polygon points="0,50 170,100 170,170 0,120" fill="#102d46" stroke="#5eead4" stroke-width="3"/><polygon points="170,100 340,50 340,120 170,170" fill="#0d2238" stroke="#5eead4" stroke-width="3"/><text x="170" y="47" text-anchor="middle" fill="#e6fffb" font-size="20" font-weight="700">USER SURFACES</text><text x="170" y="77" text-anchor="middle" fill="#bae6fd" font-size="14">Qt/QML · CLI · REST</text></g>
 <g transform="translate(120,300)"><polygon points="0,50 250,0 500,50 250,100" fill="url(#top)" stroke="#a78bfa" stroke-width="3"/><polygon points="0,50 250,100 250,185 0,135" fill="#211d52" stroke="#a78bfa" stroke-width="3"/><polygon points="250,100 500,50 500,135 250,185" fill="#1a1744" stroke="#a78bfa" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#f5f3ff" font-size="20" font-weight="700">CONTROL PLANE</text><text x="250" y="75" text-anchor="middle" fill="#ddd6fe" font-size="14">Workflow · Automation · Policy</text></g>
 <g transform="translate(80,470)"><polygon points="0,50 330,0 660,50 330,100" fill="url(#top)" stroke="#60a5fa" stroke-width="3"/><polygon points="0,50 330,100 330,200 0,150" fill="#102b5c" stroke="#60a5fa" stroke-width="3"/><polygon points="330,100 660,50 660,150 330,200" fill="#0c2148" stroke="#60a5fa" stroke-width="3"/><text x="330" y="45" text-anchor="middle" fill="#eff6ff" font-size="20" font-weight="700">INTELLIGENCE PLANE</text><text x="330" y="75" text-anchor="middle" fill="#bfdbfe" font-size="14">Distributed data · ML · OpenAI Agent</text></g>
 <g transform="translate(120,650)"><polygon points="0,50 250,0 500,50 250,100" fill="url(#top)" stroke="#34d399" stroke-width="3"/><polygon points="0,50 250,100 250,185 0,135" fill="#073f3a" stroke="#34d399" stroke-width="3"/><polygon points="250,100 500,50 500,135 250,185" fill="#052e2b" stroke="#34d399" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#ecfdf5" font-size="20" font-weight="700">OBSERVABILITY PLANE</text><text x="250" y="75" text-anchor="middle" fill="#a7f3d0" font-size="14">Metrics · Logs · Traces · Alerts</text></g>
 <g transform="translate(160,820)"><polygon points="0,50 170,0 340,50 170,100" fill="url(#top)" stroke="#fbbf24" stroke-width="3"/><polygon points="0,50 170,100 170,165 0,115" fill="#542b13" stroke="#fbbf24" stroke-width="3"/><polygon points="170,100 340,50 340,115 170,165" fill="#3b1d12" stroke="#fbbf24" stroke-width="3"/><text x="170" y="47" text-anchor="middle" fill="#fffbeb" font-size="20" font-weight="700">SECURITY PLANE</text><text x="170" y="77" text-anchor="middle" fill="#fde68a" font-size="14">AEAD · Scope · Defense · Audit</text></g>
 <g transform="translate(820,410)"><polygon points="0,50 230,0 460,50 230,100" fill="url(#top)" stroke="#94a3b8" stroke-width="3"/><polygon points="0,50 230,100 230,300 0,250" fill="#273449" stroke="#94a3b8" stroke-width="3"/><polygon points="230,100 460,50 460,250 230,300" fill="#1f2937" stroke="#94a3b8" stroke-width="3"/><text x="230" y="45" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">PLATFORM</text><text x="230" y="135" text-anchor="middle" fill="#cbd5e1" font-size="15">Linux + DE adapters</text><text x="230" y="165" text-anchor="middle" fill="#cbd5e1" font-size="15">SQLite + checkpoints</text><text x="230" y="195" text-anchor="middle" fill="#cbd5e1" font-size="15">Packaging + services</text></g>
</g>
<g stroke="#5eead4" stroke-width="2" opacity=".65" fill="none"><path d="M500 240 C700 250 720 430 820 470"/><path d="M620 390 C740 420 760 500 820 520"/><path d="M740 570 C800 590 820 610 850 650"/><path d="M600 740 C740 720 780 690 820 650"/></g>
<text x="1110" y="900" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="13">isometric architecture view · source: system-architecture.d2</text>
</svg>
